<!DOCTYPE html>
<html lang="zh-TW" data-theme="cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楊貞觀 | 前端工程師 | Resume</title>

    <!-- Apply saved theme before first paint (prevents FOUC) -->
    <script>(function(){
        var t = localStorage.getItem('resume-theme') || 'cyber';
        document.documentElement.setAttribute('data-theme', t);
        document.write('<link id="theme-css" rel="stylesheet" href="css/themes/' + t + '.css">');
    })();</script>

    <link rel="stylesheet" href="css/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Boot Screen -->
    <div id="boot-screen">
        <div id="typewriter"></div>
        <div id="skip-btn">Press [ESC] to skip</div>
    </div>

    <!-- Theme Switcher -->
    <div id="theme-switcher">
        <button id="theme-btn" title="切換主題">
            <i class="fas fa-palette"></i>
            <span id="theme-label">CYBER</span>
        </button>
    </div>

    <!-- App (rebuilt by theme.js) -->
    <div id="app" style="visibility:hidden"></div>

    <!-- Theme modules (must load before theme.js) -->
    <script src="js/data.js"></script>
    <script src="js/themes/cyber.js"></script>
    <script src="js/themes/sakura.js"></script>
    <script src="js/themes/nord.js"></script>
    <script src="js/themes/space.js"></script>
    <!-- Core -->
    <script src="js/theme.js"></script>
    <script src="js/boot.js"></script>

</body>
</html>
